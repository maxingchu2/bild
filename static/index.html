<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>多轮对话助手</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, "Segoe UI", "Microsoft YaHei", sans-serif; background: #f5f6f8; display: flex; flex-direction: column; height: 100vh; }
  header { padding: 12px 20px; background: #fff; border-bottom: 1px solid #e5e7eb; display: flex; justify-content: space-between; align-items: center; }
  header h1 { font-size: 16px; margin: 0; }
  #clear { border: 1px solid #d1d5db; background: #fff; border-radius: 6px; padding: 6px 12px; cursor: pointer; }
  #chat { flex: 1; overflow-y: auto; padding: 20px; max-width: 860px; width: 100%; margin: 0 auto; }
  .msg { margin-bottom: 16px; display: flex; }
  .msg.user { justify-content: flex-end; }
  .bubble { max-width: 80%; padding: 10px 14px; border-radius: 12px; line-height: 1.6; word-break: break-word; }
  .user .bubble { background: #2563eb; color: #fff; white-space: pre-wrap; }
  .assistant .bubble { background: #fff; border: 1px solid #e5e7eb; }
  .bubble pre { background: #0f172a; color: #e2e8f0; padding: 10px; border-radius: 8px; overflow-x: auto; }
  .bubble code { background: rgba(0,0,0,.06); padding: 1px 4px; border-radius: 4px; }
  .bubble pre code { background: none; padding: 0; }
  .bubble table { border-collapse: collapse; }
  .bubble th, .bubble td { border: 1px solid #d1d5db; padding: 4px 8px; }
  .error { color: #dc2626; }
  footer { padding: 12px 20px; background: #fff; border-top: 1px solid #e5e7eb; }
  form { max-width: 860px; margin: 0 auto; display: flex; gap: 8px; }
  textarea { flex: 1; resize: none; border: 1px solid #d1d5db; border-radius: 8px; padding: 10px; font-size: 14px; font-family: inherit; height: 48px; }
  button[type=submit] { background: #2563eb; color: #fff; border: none; border-radius: 8px; padding: 0 20px; cursor: pointer; }
  button:disabled { opacity: .5; cursor: not-allowed; }
</style>
</head>
<body>
<header>
  <h1>多轮对话助手（流式 Markdown 测试）</h1>
  <button id="clear">清空对话</button>
</header>
<div id="chat"></div>
<footer>
  <form id="form">
    <textarea id="input" placeholder="输入消息，Enter 发送，Shift+Enter 换行"></textarea>
    <button type="submit" id="send">发送</button>
  </form>
</footer>
<script>
const chatEl = document.getElementById('chat');
const form = document.getElementById('form');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
let messages = [];

function addBubble(role) {
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + role;
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  wrap.appendChild(bubble);
  chatEl.appendChild(wrap);
  chatEl.scrollTop = chatEl.scrollHeight;
  return bubble;
}

async function send(text) {
  messages.push({ role: 'user', content: text });
  addBubble('user').textContent = text;
  const bubble = addBubble('assistant');
  bubble.textContent = '…';
  sendBtn.disabled = true;

  let full = '';
  try {
    const resp = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages }),
    });
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const parts = buf.split('\n\n');
      buf = parts.pop();
      for (const part of parts) {
        const line = part.trim();
        if (!line.startsWith('data:')) continue;
        const data = line.slice(5).trim();
        if (data === '[DONE]') continue;
        const obj = JSON.parse(data);
        if (obj.error) {
          bubble.innerHTML += '<div class="error">' + obj.error + '</div>';
          continue;
        }
        full += obj.content || '';
        bubble.innerHTML = marked.parse(full);
        chatEl.scrollTop = chatEl.scrollHeight;
      }
    }
    if (full) messages.push({ role: 'assistant', content: full });
  } catch (e) {
    bubble.innerHTML = '<div class="error">请求失败: ' + e + '</div>';
  } finally {
    sendBtn.disabled = false;
    input.focus();
  }
}

form.addEventListener('submit', (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text || sendBtn.disabled) return;
  input.value = '';
  send(text);
});

input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    form.requestSubmit();
  }
});

document.getElementById('clear').addEventListener('click', () => {
  messages = [];
  chatEl.innerHTML = '';
});
</script>
</body>
</html>
